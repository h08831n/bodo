name: CI

on:
  push:
    branches: [main, 'step/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @bodo/ui build-storybook

      - name: Test (Unit tests & Check no external URLs)
        run: |
          pnpm test
          node --test scripts/__tests__/check-compose-conflict.test.mjs

      - name: API Smoke Test (Background boot & health/live probe)
        shell: bash
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health/live || true)
            if [ "$STATUS" = "200" ]; then
              echo "API booted successfully and /health/live responded with 200 OK"
              SUCCESS=1
              break
            fi
            echo "Waiting for API (attempt $i, status: $STATUS)..."
            sleep 1
          done
          kill -9 $API_PID || true
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Smoke test failed: /health/live did not return 200 OK"
            exit 1
          fi

      - name: Dev Endpoint Production Guard Smoke Test (Verify 404 in production mode)
        shell: bash
        run: |
          NODE_ENV=production node apps/api/dist/main.js &
          PROD_API_PID=$!
          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health/live || true)
            if [ "$STATUS" = "200" ]; then
              SUCCESS=1
              break
            fi
            sleep 1
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Production API failed to boot for smoke test"
            kill -9 $PROD_API_PID || true
            exit 1
          fi
          DEV_RES_1=$(curl -s -w "\n%{http_code}" -H "X-Database: erp_dev" http://localhost:3000/v1/dev/tenant-info || true)
          DEV_BODY_1=$(echo "$DEV_RES_1" | head -n -1)
          DEV_STATUS_1=$(echo "$DEV_RES_1" | tail -n 1)

          DEV_RES_2=$(curl -s -w "\n%{http_code}" -H "X-Database: non_existent" http://localhost:3000/v1/dev/tenant-info || true)
          DEV_BODY_2=$(echo "$DEV_RES_2" | head -n -1)
          DEV_STATUS_2=$(echo "$DEV_RES_2" | tail -n 1)

          kill -9 $PROD_API_PID || true

          echo "GET /v1/dev/tenant-info with X-Database: erp_dev -> HTTP $DEV_STATUS_1: $DEV_BODY_1"
          echo "GET /v1/dev/tenant-info with X-Database: non_existent -> HTTP $DEV_STATUS_2: $DEV_BODY_2"

          if [ "$DEV_STATUS_1" != "404" ] || [[ "$DEV_BODY_1" != *"NOT_FOUND"* ]]; then
            echo "Smoke test failed: expected HTTP 404 with code NOT_FOUND for existing X-Database, got status $DEV_STATUS_1 and body $DEV_BODY_1"
            exit 1
          fi

          if [ "$DEV_STATUS_2" != "404" ] || [[ "$DEV_BODY_2" != *"NOT_FOUND"* ]]; then
            echo "Smoke test failed: expected HTTP 404 with code NOT_FOUND for non-existent X-Database, got status $DEV_STATUS_2 and body $DEV_BODY_2"
            exit 1
          fi

          echo "Smoke test passed: /v1/dev/tenant-info strictly returns 404 with code NOT_FOUND in production mode for both existing and nonexistent databases"

  docker-verify:
    name: Verify Docker Builds
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build API Docker Image
        run: docker build -f apps/api/Dockerfile -t bodo-api:ci .

      - name: Build Web Docker Image
        run: docker build -f apps/web/Dockerfile -t bodo-web:ci .

      - name: Verify Docker Compose config
        run: docker compose --env-file .env -f infra/docker-compose.yml config

  database-integration:
    name: Database Integration & Drift Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass redispassword
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redispassword ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Check Drift Filter Unit Tests
        run: node --test scripts/__tests__/check-drift.test.mjs

      - name: Initialize Database Roles
        run: pnpm db:init-roles
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres

      - name: Check Database Schema Drift
        run: pnpm db:check-drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres

      - name: Run Database Integration Tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
          REDIS_URL: redis://:redispassword@127.0.0.1:6379
          REDIS_PASSWORD: redispassword

  dev-setup-verification:
    name: Verify Developer Setup Flow (docker-compose.dev & db:setup-dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Copy .env strictly from .env.example
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Start PostgreSQL via docker-compose.dev.yml
        run: |
          docker compose --env-file .env -f infra/docker-compose.dev.yml up -d postgres
          HEALTHY=false
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' bodo-postgres-dev 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL dev container is healthy!"
              HEALTHY=true
              break
            fi
            echo "Waiting for postgres health status (attempt $i/30, current: $STATUS)..."
            sleep 2
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: PostgreSQL container failed to become healthy."
            docker logs bodo-postgres-dev
            exit 1
          fi

      - name: Run Developer Database Setup (pnpm db:setup-dev)
        run: pnpm db:setup-dev

      - name: Verify erp_dev contents (4 currencies, 7 lost reasons)
        run: pnpm db:verify-dev

      - name: Stop dev containers
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml down -v
