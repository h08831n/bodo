name: CI

on:
  push:
    branches: [main, 'step/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @bodo/ui build-storybook

      - name: Test (Unit tests & Check no external URLs)
        run: pnpm test

      - name: API Smoke Test (Background boot & health/live probe)
        shell: bash
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health/live || true)
            if [ "$STATUS" = "200" ]; then
              echo "API booted successfully and /health/live responded with 200 OK"
              SUCCESS=1
              break
            fi
            echo "Waiting for API (attempt $i, status: $STATUS)..."
            sleep 1
          done
          kill -9 $API_PID || true
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Smoke test failed: /health/live did not return 200 OK"
            exit 1
          fi

  docker-verify:
    name: Verify Docker Builds
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build API Docker Image
        run: docker build -f apps/api/Dockerfile -t bodo-api:ci .

      - name: Build Web Docker Image
        run: docker build -f apps/web/Dockerfile -t bodo-web:ci .

      - name: Verify Docker Compose config
        run: docker compose --env-file .env -f infra/docker-compose.yml config

  database-integration:
    name: Database Integration & Drift Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Check Drift Filter Unit Tests
        run: node --test scripts/__tests__/check-drift.test.mjs

      - name: Initialize Database Roles
        run: pnpm db:init-roles
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres

      - name: Check Database Schema Drift
        run: pnpm db:check-drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres

      - name: Run Database Integration Tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres

  dev-setup-verification:
    name: Verify Developer Setup Flow (docker-compose.dev & db:setup-dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Copy .env strictly from .env.example
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL via docker-compose.dev.yml
        run: |
          docker compose --env-file .env -f infra/docker-compose.dev.yml up -d postgres
          HEALTHY=false
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' bodo-postgres-dev 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL dev container is healthy!"
              HEALTHY=true
              break
            fi
            echo "Waiting for postgres health status (attempt $i/30, current: $STATUS)..."
            sleep 2
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: PostgreSQL container failed to become healthy."
            docker logs bodo-postgres-dev
            exit 1
          fi

      - name: Run Developer Database Setup (pnpm db:setup-dev)
        run: |
          pnpm db:setup-dev 2>&1 | tee setup_output.log || {
            ERR_MSG=$(tail -n 25 setup_output.log | tr '\n' ' ' | tr '"' "'")
            echo "::error title=DevSetupFailed::$ERR_MSG"
            docker logs bodo-postgres-dev > docker_pg.log 2>&1
            PG_LOG=$(tail -n 25 docker_pg.log | tr '\n' ' ' | tr '"' "'")
            echo "::error title=PostgresLogs::$PG_LOG"
            exit 1
          }

      - name: Verify erp_dev contents (4 currencies, 7 lost reasons)
        run: |
          docker exec -e PGPASSWORD=app_secret_change_in_prod bodo-postgres-dev psql -U erp_app -d erp_dev -c "SELECT code, decimals FROM currencies;"
          CURR_COUNT=$(docker exec -e PGPASSWORD=app_secret_change_in_prod bodo-postgres-dev psql -U erp_app -d erp_dev -t -A -c "SELECT COUNT(*) FROM currencies;")
          if [ "$CURR_COUNT" -ne 4 ]; then
            echo "Expected 4 currencies, found $CURR_COUNT"
            exit 1
          fi

          docker exec -e PGPASSWORD=app_secret_change_in_prod bodo-postgres-dev psql -U erp_app -d erp_dev -c "SELECT name, applies_to FROM lost_reasons;"
          REASONS_COUNT=$(docker exec -e PGPASSWORD=app_secret_change_in_prod bodo-postgres-dev psql -U erp_app -d erp_dev -t -A -c "SELECT COUNT(*) FROM lost_reasons;")
          if [ "$REASONS_COUNT" -ne 7 ]; then
            echo "Expected 7 lost reasons, found $REASONS_COUNT"
            exit 1
          fi
          echo "SUCCESS: erp_dev verified with 4 currencies and 7 lost reasons."

      - name: Stop dev containers
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml down -v
