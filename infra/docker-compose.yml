name: bodo

services:
  postgres:
    image: postgres:16-alpine
    container_name: bodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # Notice: ports are NOT published to host to enforce network isolation.
    # Postgres is only reachable via internal Docker network.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bodo-redis
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Notice: ports are NOT published to host. Only internal Docker network access.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bodo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      MASTER_PASSWORD_INITIAL: ${MASTER_PASSWORD_INITIAL:?MASTER_PASSWORD_INITIAL is required}
      DB_MANAGER_ENABLED: ${DB_MANAGER_ENABLED:-true}
      DB_MANAGER_ALLOWED_IPS: ${DB_MANAGER_ALLOWED_IPS:-}
      DB_LIST_PUBLIC: ${DB_LIST_PUBLIC:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PG_BIN_PATH: /usr/bin
    # Notice: API port 3000 is NOT exposed directly on host; only accessible through Nginx reverse proxy.
    volumes:
      - filestore:/data/filestore
      - backups:/data/backups
      - config:/data/config
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bodo-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MASTER_PASSWORD_INITIAL: ${MASTER_PASSWORD_INITIAL:?MASTER_PASSWORD_INITIAL is required}
      DB_MANAGER_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    volumes:
      - filestore:/data/filestore
      - backups:/data/backups
      - config:/data/config

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: bodo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # ONLY web (Nginx) publishes port on host!
    ports:
      - '${WEB_PORT:-80}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  filestore:
  backups:
  config:
