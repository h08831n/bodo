services:
  postgres:
    image: postgres:16-alpine
    container_name: bodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bodo-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bodo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      MASTER_PASSWORD_INITIAL: ${MASTER_PASSWORD_INITIAL:-MasterSecurePassword2026!}
      DB_MANAGER_ENABLED: ${DB_MANAGER_ENABLED:-true}
      DB_MANAGER_ALLOWED_IPS: ${DB_MANAGER_ALLOWED_IPS:-}
      DB_LIST_PUBLIC: ${DB_LIST_PUBLIC:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretJwtKey2026Min16Chars!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      PG_BIN_PATH: /usr/bin
    volumes:
      - filestore:/data/filestore
      - backups:/data/backups
      - config:/data/config
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bodo-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MASTER_PASSWORD_INITIAL: ${MASTER_PASSWORD_INITIAL:-MasterSecurePassword2026!}
      DB_MANAGER_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:-SuperSecretJwtKey2026Min16Chars!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
    volumes:
      - filestore:/data/filestore
      - backups:/data/backups
      - config:/data/config

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: bodo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-80}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  filestore:
  backups:
  config:
