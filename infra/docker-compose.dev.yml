services:
  postgres:
    image: postgres:16-alpine
    container_name: bodo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # Bound strictly to 127.0.0.1 for local developer machine only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bodo-redis-dev
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --requirepass "${REDIS_PASSWORD:-redispassword}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
    # Bound strictly to 127.0.0.1 for local developer machine only
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-redispassword}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
